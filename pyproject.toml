[project]
name = "semantic-data-quality-benchmark"
version = "0.1.0"
description = "A controlled benchmark for healthcare laboratory data integration"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.4.5",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
